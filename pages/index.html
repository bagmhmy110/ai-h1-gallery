<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 画廊</title>
    <style id="theme-vars">
:root {
  --brand-background: #0c0c0e;
  --brand-foreground: #ededf0;
  --brand-card: #161618;
  --brand-card-foreground: #ededf0;
  --brand-popover: #1c1c1f;
  --brand-popover-foreground: #ededf0;
  --brand-primary: #c9a96e;
  --brand-primary-foreground: #0c0c0e;
  --brand-muted: #1c1c1f;
  --brand-muted-foreground: #8a8a92;
  --brand-border: #252528;
  --brand-input: #252528;
  --brand-ring: #c9a96e;
  --brand-radius-sm: 6px;
  --brand-radius-md: 10px;
  --brand-radius-lg: 14px;
  --brand-radius-small: 6px;
  --brand-radius-medium: 10px;
  --brand-radius-large: 14px;
  --brand-success: #4ade80;
  --brand-warning: #fbbf24;
  --brand-danger: #f87171;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex; align-items: center; justify-content: center;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <style id="gallery-styles">
      .gallery-container { width: 100%; max-width: 1600px; margin: 0 auto; padding: 0 20px; }
      .gallery-header { padding: 40px 0 28px; text-align: center; }
      .gallery-title { font-size: clamp(28px, 4vw, 42px); font-weight: 700; letter-spacing: 2px; line-height: 1.2; }
      .gallery-title .accent { color: var(--brand-primary); }
      .gallery-subtitle { margin-top: 10px; font-size: 14px; color: var(--brand-muted-foreground); letter-spacing: 1px; }
      .gallery-subtitle .num { color: var(--brand-foreground); font-weight: 600; }

      /* ---------- Filter Bar ---------- */
      .filter-bar {
        position: sticky; top: 0; z-index: 50;
        background: rgba(12, 12, 14, 0.88);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--brand-border);
      }
      .filter-bar-inner {
        display: flex; align-items: center; justify-content: space-between;
        gap: 14px; padding: 10px 0; flex-wrap: wrap;
      }
      /* Date tabs row */
      .date-row {
        display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
      }
      .date-row::-webkit-scrollbar { height: 3px; }
      .date-row::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 2px; }
      .date-tab {
        padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
        border: 1px solid var(--brand-border); background: var(--brand-card);
        color: var(--brand-muted-foreground); transition: all .2s ease; white-space: nowrap;
        user-select: none; font-weight: 500;
      }
      .date-tab:hover { color: var(--brand-foreground); border-color: var(--brand-primary); }
      .date-tab.active {
        background: var(--brand-primary); color: var(--brand-primary-foreground);
        border-color: var(--brand-primary); font-weight: 600;
      }
      .date-tab .date-count { font-size: 11px; opacity: .7; margin-left: 4px; }

      /* Sub-category chips row */
      .subchips-row {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      }
      .chip {
        padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
        border: 1px solid var(--brand-border); background: var(--brand-card);
        color: var(--brand-muted-foreground); transition: all .2s ease; white-space: nowrap; user-select: none;
      }
      .chip:hover { color: var(--brand-foreground); border-color: var(--brand-primary); }
      .chip.active {
        background: var(--brand-primary); color: var(--brand-primary-foreground);
        border-color: var(--brand-primary); font-weight: 600;
      }
      .chip .chip-count { font-size: 11px; opacity: .7; margin-left: 4px; }

      .search-wrap { position: relative; flex: 0 1 280px; min-width: 180px; }
      .search-wrap .search-icon {
        position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
        color: var(--brand-muted-foreground); pointer-events: none; display: flex;
      }
      .search-input {
        width: 100%; padding: 9px 14px 9px 38px; border-radius: 999px;
        background: var(--brand-card); border: 1px solid var(--brand-border);
        color: var(--brand-foreground); font-size: 13px; outline: none; transition: border-color .2s ease;
      }
      .search-input::placeholder { color: var(--brand-muted-foreground); }
      .search-input:focus { border-color: var(--brand-primary); }

      .filter-divider { width: 100%; height: 1px; background: var(--brand-border); margin: 4px 0; }

      @media (max-width: 640px) {
        .filter-bar-inner { flex-direction: column; align-items: stretch; }
        .search-wrap { flex: 1 1 100%; }
      }

      /* ---------- Grid ---------- */
      .gallery-grid {
        display: grid; gap: 16px; padding: 24px 0 40px;
        grid-template-columns: repeat(2, 1fr);
      }
      @media (min-width: 768px)  { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 1024px) { .gallery-grid { grid-template-columns: repeat(4, 1fr); } }
      @media (min-width: 1440px) { .gallery-grid { grid-template-columns: repeat(5, 1fr); } }

      .card {
        position: relative; border-radius: var(--brand-radius-lg); overflow: hidden;
        border: 1px solid var(--brand-border); background: var(--brand-card);
        cursor: pointer; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      }
      .card:hover { transform: translateY(-3px) scale(1.015); border-color: var(--brand-primary); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
      .card-img-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; background: #0a0a0c; }
      .card-img {
        width: 100%; height: 100%; object-fit: cover; display: block;
        opacity: 0; transition: opacity .4s ease;
      }
      .card-img.loaded { opacity: 1; }
      .card-img-wrap.loading::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(100deg, #141416 30%, #1f1f23 50%, #141416 70%);
        background-size: 200% 100%; animation: shimmer 1.4s infinite;
      }
      .card-img-wrap.error::before { content: ''; position: absolute; inset: 0; background: #141416; }
      .card-img-wrap.error::after {
        content: '加载失败'; position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center; color: var(--brand-muted-foreground); font-size: 12px;
      }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      .card-badge {
        position: absolute; top: 8px; left: 8px; z-index: 2;
        padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
        background: rgba(0, 0, 0, 0.55); color: #fff; backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.12);
      }
      .card-overlay {
        position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
        justify-content: flex-end; padding: 12px; opacity: 0; transition: opacity .25s ease;
        background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 45%, transparent 75%);
        pointer-events: none;
      }
      .card:hover .card-overlay { opacity: 1; }
      .card-overlay-art { color: var(--brand-primary); font-size: 13px; font-weight: 600; line-height: 1.3; }
      .card-overlay-ch { color: #fff; font-size: 12px; margin-top: 3px; opacity: .9; line-height: 1.3; }

      .empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 90px 20px; color: var(--brand-muted-foreground); }
      .empty-state.show { display: flex; }
      .empty-state .empty-icon { margin-bottom: 16px; opacity: .5; }
      .empty-state .empty-icon svg { width: 52px; height: 52px; }
      .empty-state p { font-size: 15px; }

      .pagination { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 8px 0 60px; }
      .pagination .pg-info { width: 100%; text-align: center; font-size: 13px; color: var(--brand-muted-foreground); margin-bottom: 12px; }
      .pagination .pg-info .num { color: var(--brand-foreground); font-weight: 600; }
      .pg-btn {
        min-width: 36px; height: 36px; padding: 0 10px; border-radius: var(--brand-radius-sm);
        border: 1px solid var(--brand-border); background: var(--brand-card); color: var(--brand-foreground);
        font-size: 13px; cursor: pointer; transition: all .2s ease; display: inline-flex; align-items: center; justify-content: center;
      }
      .pg-btn:hover:not(:disabled):not(.active) { border-color: var(--brand-primary); color: var(--brand-primary); }
      .pg-btn.active { background: var(--brand-primary); color: var(--brand-primary-foreground); border-color: var(--brand-primary); font-weight: 600; }
      .pg-btn:disabled { opacity: .35; cursor: not-allowed; }
      .pg-ellipsis { color: var(--brand-muted-foreground); padding: 0 4px; user-select: none; }
      .pg-btn svg { width: 16px; height: 16px; }

      /* ---------- Lightbox ---------- */
      .lightbox {
        position: fixed; inset: 0; z-index: 100; display: flex;
        opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease;
        background: rgba(0, 0, 0, 0.92);
      }
      .lightbox.open { opacity: 1; visibility: visible; }
      .lb-layout { position: relative; display: flex; width: 100%; height: 100%; }
      .lb-stage-area {
        flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center;
        min-width: 0; min-height: 0; overflow: hidden;
      }
      .lb-stage {
        position: relative; display: flex; align-items: center; justify-content: center;
        width: 100%; height: 100%; cursor: zoom-in;
      }
      .lb-image {
        max-height: 90vh; max-width: 100%; object-fit: contain; display: block;
        user-select: none; -webkit-user-drag: none; transition: transform .08s linear;
        will-change: transform; transform-origin: center center;
      }
      .lb-arrow {
        position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
        width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(255,255,255,0.15); background: rgba(20,20,22,0.6); color: #fff;
        cursor: pointer; transition: all .2s ease; backdrop-filter: blur(6px);
      }
      .lb-arrow:hover { background: var(--brand-primary); color: var(--brand-primary-foreground); border-color: var(--brand-primary); }
      .lb-arrow.prev { left: 18px; }
      .lb-arrow.next { right: 18px; }
      .lb-arrow svg { width: 22px; height: 22px; }
      .lb-arrow:disabled { opacity: .25; cursor: not-allowed; }
      .lb-arrow:disabled:hover { background: rgba(20,20,22,0.6); color: #fff; border-color: rgba(255,255,255,0.15); }
      .lb-zoom-bar {
        position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 5;
        display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 999px;
        background: rgba(20,20,22,0.75); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(6px);
      }
      .lb-zoom-bar button {
        width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
        background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; transition: background .2s ease;
      }
      .lb-zoom-bar button:hover { background: rgba(255,255,255,0.15); }
      .lb-zoom-bar button svg { width: 16px; height: 16px; }
      .lb-zoom-pct { color: #fff; font-size: 12px; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
      .lb-close-btn {
        position: absolute; top: 16px; right: 16px; z-index: 60;
        width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(255,255,255,0.15); background: rgba(20,20,22,0.7); color: #fff;
        cursor: pointer; transition: all .2s ease; backdrop-filter: blur(6px);
      }
      .lb-close-btn:hover { background: var(--brand-danger); border-color: var(--brand-danger); }
      .lb-close-btn svg { width: 20px; height: 20px; }
      .lb-counter {
        position: absolute; top: 20px; left: 20px; z-index: 60;
        font-size: 13px; color: rgba(255,255,255,0.75); background: rgba(20,20,22,0.6);
        padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
      }
      .lb-panel {
        flex: 0 0 400px; background: var(--brand-popover); border-left: 1px solid var(--brand-border);
        display: flex; flex-direction: column; padding: 20px; overflow: hidden;
      }
      .lb-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
      .lb-tag {
        padding: 4px 11px; border-radius: 999px; font-size: 12px; border: 1px solid var(--brand-border);
        background: var(--brand-card); color: var(--brand-foreground);
      }
      .lb-tag.cat { background: var(--brand-primary); color: var(--brand-primary-foreground); border-color: var(--brand-primary); font-weight: 600; }
      .lb-copy {
        display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: var(--brand-radius-sm);
        border: 1px solid var(--brand-border); background: var(--brand-card); color: var(--brand-foreground);
        font-size: 13px; cursor: pointer; transition: all .2s ease; align-self: flex-start;
      }
      .lb-copy:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
      .lb-copy.copied { background: var(--brand-success); color: #0c0c0e; border-color: var(--brand-success); }
      .lb-copy svg { width: 15px; height: 15px; }
      .lb-prompt {
        margin-top: 14px; flex: 1 1 auto; overflow-y: auto; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
        font-size: 14px; line-height: 1.7; color: var(--brand-foreground); white-space: pre-wrap; word-break: break-word;
        padding-right: 6px;
      }
      .lb-prompt::-webkit-scrollbar { width: 6px; }
      .lb-prompt::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 3px; }
      .lb-filename { margin-top: 12px; font-size: 12px; color: var(--brand-muted-foreground); word-break: break-all; }
      @media (max-width: 900px) {
        .lb-layout { flex-direction: column; }
        .lb-panel { flex: 0 0 auto; max-height: 42vh; border-left: none; border-top: 1px solid var(--brand-border); }
        .lb-image { max-height: 52vh; }
        .lb-arrow.prev { left: 10px; }
        .lb-arrow.next { right: 10px; }
      }
    </style>
    <main>
      <header class="gallery-header">
        <div class="gallery-container">
          <h1 class="gallery-title">AI <span class="accent">画廊</span></h1>
          <p class="gallery-subtitle">共 <span class="num" id="total-count">0</span> 张 · 当前筛选 <span class="num" id="filtered-count">0</span> 张</p>
        </div>
      </header>

      <div class="filter-bar">
        <div class="gallery-container">
          <div class="filter-bar-inner">
            <!-- Row 1: Date tabs -->
            <div class="date-row" id="date-row"></div>
            <div class="filter-divider"></div>
            <!-- Row 2: Sub-category chips + search -->
            <div class="subchips-row" id="subchips-row"></div>
            <div class="search-wrap">
              <span class="search-icon"><i data-lucide="search" style="width:16px;height:16px;"></i></span>
              <input type="text" id="search-input" class="search-input" placeholder="搜索提示词 / 角色 / 风格…" autocomplete="off" />
            </div>
          </div>
        </div>
      </div>

      <section class="gallery-container">
        <div class="gallery-grid" id="gallery-grid"></div>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon"><i data-lucide="image-off"></i></div>
          <p>没有找到匹配的图片</p>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>

      <div class="lightbox" id="lightbox" aria-hidden="true">
        <div class="lb-layout">
          <span class="lb-counter" id="lb-counter"></span>
          <button class="lb-close-btn" id="lb-close" title="关闭 (ESC)"><i data-lucide="x"></i></button>
          <div class="lb-stage-area">
            <button class="lb-arrow prev" id="lb-prev" title="上一张 (←)"><i data-lucide="chevron-left"></i></button>
            <div class="lb-stage" id="lb-stage">
              <img class="lb-image" id="lb-image" alt="" />
              <div class="lb-zoom-bar">
                <button id="lb-zoom-out" title="缩小 (-)"><i data-lucide="minus"></i></button>
                <span class="lb-zoom-pct" id="lb-zoom-pct">100%</span>
                <button id="lb-zoom-in" title="放大 (+)"><i data-lucide="plus"></i></button>
                <button id="lb-zoom-reset" title="重置 (0)"><i data-lucide="rotate-ccw"></i></button>
              </div>
            </div>
            <button class="lb-arrow next" id="lb-next" title="下一张 (→)"><i data-lucide="chevron-right"></i></button>
          </div>
          <aside class="lb-panel" id="lb-panel">
            <div class="lb-tags" id="lb-tags"></div>
            <button class="lb-copy" id="lb-copy"><i data-lucide="copy"></i><span id="lb-copy-text">复制提示词</span></button>
            <div class="lb-prompt" id="lb-prompt"></div>
            <div class="lb-filename" id="lb-filename"></div>
          </aside>
        </div>
      </div>
    </main>
    <script src="../assets/gallery-data.js"></script>
    <script>
      (function () {
        'use strict';

        var HF_BASE = 'https://huggingface.co/datasets/LIUFAFA/ai-h1-gallery/resolve/main/';
        var IMAGE_BASES = {
          '20260731': HF_BASE + '20260731/',
          '20260802': HF_BASE + '20260802/',
          '20260803': HF_BASE + '20260803/',
          '20260811': HF_BASE + '20260811/',
          '20260813': HF_BASE + '20260813/',
          '20260814': HF_BASE + '20260814/',
          '20260815': HF_BASE + '20260815/',
          '20260817': HF_BASE + '20260817/',
          '20260819': HF_BASE + '20260819/',
          '20260820': HF_BASE + '20260820/',
          '20260821': HF_BASE + '20260821/',
          '20260823': HF_BASE + '20260823/',
          '20260825': HF_BASE + '20260825/',
          '20260826': HF_BASE + '20260826/',
          '20260827': HF_BASE + '20260827/'
        };
        function imgSrc(item) {
          return (IMAGE_BASES[item.d] || IMAGE_BASES['20260731']) + item.f;
        }

        // Category name lookup
        var CAT_NAMES = {
          'anime': '二次元', 'wuthering': '鸣潮风', 'guoman3d': '国漫3D',
          'real': '写实', 'retro': '复古', 'guofeng': '国风', 'dunhuang': '敦煌',
          'sexy': '性感', 'fugu': '性感复古', 'xieshi': '性感写实',
          'ccd': '性感CCD', 'jiayi': '性感嫁衣', 'xhs': '小红书',
          'diff': '仙侠', 'qn': '千禧怀旧', 'ty': '青春日记',
          'tyy': '青春记忆', 'stu': '学生旧照', 'tea': '教师旧照'
        };

        var PER_PAGE = 80;
        var allData = (window.GALLERY_DATA && Array.isArray(window.GALLERY_DATA)) ? window.GALLERY_DATA : [];
        var filtered = [];
        var state = { date: 'all', category: 'all', search: '', page: 1 };

        // Build date list and sub-category map from data
        var dateMap = {};      // date -> total count
        var dateCatMap = {};   // date -> { cat: count }
        var dateList = [];     // sorted unique dates

        allData.forEach(function (item) {
          var d = item.d;
          if (!dateMap[d]) {
            dateMap[d] = 0;
            dateCatMap[d] = {};
            dateList.push(d);
          }
          dateMap[d]++;
          if (!dateCatMap[d][item.c]) dateCatMap[d][item.c] = 0;
          dateCatMap[d][item.c]++;
        });
        dateList.sort();

        // Format date for display: "20260827" -> "08/27"
        function formatDate(dateStr) {
          if (dateStr === 'all') return '全部';
          var m = dateStr.substring(4, 6);
          var d = dateStr.substring(6, 8);
          return m + '/' + d;
        }

        // Lightbox state
        var lbIndex = 0;
        var lbZoom = 1, lbPanX = 0, lbPanY = 0;
        var isDragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
        var copyTimer = null;

        // DOM refs
        var elGrid = document.getElementById('gallery-grid');
        var elEmpty = document.getElementById('empty-state');
        var elPagination = document.getElementById('pagination');
        var elDateRow = document.getElementById('date-row');
        var elSubchips = document.getElementById('subchips-row');
        var elSearch = document.getElementById('search-input');
        var elTotal = document.getElementById('total-count');
        var elFiltered = document.getElementById('filtered-count');

        var elLightbox = document.getElementById('lightbox');
        var elLbImage = document.getElementById('lb-image');
        var elLbStage = document.getElementById('lb-stage');
        var elLbCounter = document.getElementById('lb-counter');
        var elLbTags = document.getElementById('lb-tags');
        var elLbPrompt = document.getElementById('lb-prompt');
        var elLbFilename = document.getElementById('lb-filename');
        var elLbCopy = document.getElementById('lb-copy');
        var elLbCopyText = document.getElementById('lb-copy-text');
        var elLbZoomPct = document.getElementById('lb-zoom-pct');

        function refreshIcons() {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        }

        // ---------- Date tabs ----------
        function renderDateTabs() {
          elDateRow.innerHTML = '';

          // "全部" tab
          var allTab = document.createElement('button');
          allTab.type = 'button';
          allTab.className = 'date-tab' + (state.date === 'all' ? ' active' : '');
          allTab.innerHTML = '全部<span class="date-count">' + allData.length + '</span>';
          allTab.addEventListener('click', function () {
            if (state.date === 'all') return;
            state.date = 'all';
            state.category = 'all';
            state.page = 1;
            renderDateTabs();
            renderSubchips();
            applyAndRender();
          });
          elDateRow.appendChild(allTab);

          // Date tabs
          dateList.forEach(function (date) {
            var tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'date-tab' + (state.date === date ? ' active' : '');
            tab.innerHTML = formatDate(date) + '<span class="date-count">' + dateMap[date] + '</span>';
            tab.addEventListener('click', function () {
              if (state.date === date) return;
              state.date = date;
              state.category = 'all';
              state.page = 1;
              renderDateTabs();
              renderSubchips();
              applyAndRender();
            });
            elDateRow.appendChild(tab);
          });
        }

        // ---------- Sub-category chips ----------
        function renderSubchips() {
          elSubchips.innerHTML = '';

          // "全部" chip
          var allChip = document.createElement('button');
          allChip.type = 'button';
          allChip.className = 'chip' + (state.category === 'all' ? ' active' : '');
          var totalCount = state.date === 'all' ? allData.length : (dateMap[state.date] || 0);
          allChip.innerHTML = '全部<span class="chip-count">' + totalCount + '</span>';
          allChip.addEventListener('click', function () {
            if (state.category === 'all') return;
            state.category = 'all';
            state.page = 1;
            renderSubchips();
            applyAndRender();
          });
          elSubchips.appendChild(allChip);

          // If a specific date is selected, show its sub-categories
          if (state.date !== 'all') {
            var cats = dateCatMap[state.date];
            if (cats) {
              var sortedCats = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
              sortedCats.forEach(function (cat) {
                var name = CAT_NAMES[cat] || cat;
                var chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'chip' + (state.category === cat ? ' active' : '');
                chip.innerHTML = name + '<span class="chip-count">' + cats[cat] + '</span>';
                chip.addEventListener('click', function () {
                  if (state.category === cat) return;
                  state.category = cat;
                  state.page = 1;
                  renderSubchips();
                  applyAndRender();
                });
                elSubchips.appendChild(chip);
              });
            }
          } else {
            // When "all" dates selected, show all categories
            var allCats = {};
            allData.forEach(function (item) {
              if (!allCats[item.c]) allCats[item.c] = 0;
              allCats[item.c]++;
            });
            var sortedAll = Object.keys(allCats).sort(function (a, b) { return allCats[b] - allCats[a]; });
            sortedAll.forEach(function (cat) {
              var name = CAT_NAMES[cat] || cat;
              var chip = document.createElement('button');
              chip.type = 'button';
              chip.className = 'chip' + (state.category === cat ? ' active' : '');
              chip.innerHTML = name + '<span class="chip-count">' + allCats[cat] + '</span>';
              chip.addEventListener('click', function () {
                if (state.category === cat) return;
                state.category = cat;
                state.page = 1;
                renderSubchips();
                applyAndRender();
              });
              elSubchips.appendChild(chip);
            });
          }
        }

        // ---------- Search (debounced) ----------
        var searchTimer = null;
        elSearch.addEventListener('input', function () {
          clearTimeout(searchTimer);
          var val = elSearch.value;
          searchTimer = setTimeout(function () {
            state.search = val.trim().toLowerCase();
            state.page = 1;
            applyAndRender();
          }, 300);
        });

        // ---------- Filtering ----------
        function computeFiltered() {
          var q = state.search;
          filtered = allData.filter(function (item) {
            if (state.date !== 'all' && item.d !== state.date) return false;
            if (state.category !== 'all' && item.c !== state.category) return false;
            if (q) {
              var hay = ((item.p || '') + ' ' + (item.ch || '') + ' ' + (item.a || '')).toLowerCase();
              if (hay.indexOf(q) === -1) return false;
            }
            return true;
          });
        }

        // ---------- Render grid ----------
        function renderGrid() {
          elGrid.innerHTML = '';
          var total = filtered.length;
          var start = (state.page - 1) * PER_PAGE;
          var end = Math.min(start + PER_PAGE, total);
          var pageItems = filtered.slice(start, end);

          var frag = document.createDocumentFragment();
          pageItems.forEach(function (item, i) {
            frag.appendChild(createCard(item, start + i));
          });
          elGrid.appendChild(frag);
        }

        function createCard(item, idx) {
          var card = document.createElement('div');
          card.className = 'card';
          var wrap = document.createElement('div');
          wrap.className = 'card-img-wrap loading';
          var img = document.createElement('img');
          img.className = 'card-img';
          img.loading = 'lazy';
          img.alt = item.a || item.cn || '';
          img.src = imgSrc(item);
          (function (w, im) {
            im.addEventListener('load', function () { w.classList.remove('loading'); im.classList.add('loaded'); });
            im.addEventListener('error', function () { w.classList.remove('loading'); w.classList.add('error'); });
          })(wrap, img);
          var badge = document.createElement('span');
          badge.className = 'card-badge';
          badge.textContent = item.cn || '';
          var overlay = document.createElement('div');
          overlay.className = 'card-overlay';
          if (item.a) { var ovArt = document.createElement('div'); ovArt.className = 'card-overlay-art'; ovArt.textContent = item.a; overlay.appendChild(ovArt); }
          if (item.ch) { var ovCh = document.createElement('div'); ovCh.className = 'card-overlay-ch'; ovCh.textContent = item.ch; overlay.appendChild(ovCh); }
          wrap.appendChild(img); wrap.appendChild(badge); wrap.appendChild(overlay);
          card.appendChild(wrap);
          card.addEventListener('click', function () { openLightbox(idx); });
          return card;
        }

        // ---------- Pagination ----------
        function renderPagination() {
          elPagination.innerHTML = '';
          var total = filtered.length;
          var totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
          if (state.page > totalPages) state.page = totalPages;
          var start = (state.page - 1) * PER_PAGE + 1;
          var end = Math.min(state.page * PER_PAGE, total);
          if (total === 0) { start = 0; end = 0; }
          var info = document.createElement('div');
          info.className = 'pg-info';
          info.innerHTML = '第 <span class="num">' + start + '–' + end + '</span> 张 / 共 <span class="num">' + total + '</span> 张';
          elPagination.appendChild(info);
          if (total === 0) return;
          elPagination.appendChild(makePgBtn('«', 1, state.page === 1, '首页'));
          elPagination.appendChild(makePgBtn('‹', state.page - 1, state.page === 1, '上一页'));
          var pages = getPageList(state.page, totalPages);
          pages.forEach(function (p) {
            if (p === '…') { var span = document.createElement('span'); span.className = 'pg-ellipsis'; span.textContent = '…'; elPagination.appendChild(span); }
            else { var b = makePgBtn(String(p), p, false, '第' + p + '页'); if (p === state.page) b.classList.add('active'); elPagination.appendChild(b); }
          });
          elPagination.appendChild(makePgBtn('›', state.page + 1, state.page === totalPages, '下一页'));
          elPagination.appendChild(makePgBtn('»', totalPages, state.page === totalPages, '末页'));
        }

        function makePgBtn(label, target, disabled, title) {
          var btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'pg-btn'; btn.textContent = label;
          if (title) btn.title = title;
          if (disabled) btn.disabled = true;
          btn.addEventListener('click', function () {
            if (disabled) return;
            if (target < 1 || target > Math.ceil(filtered.length / PER_PAGE)) return;
            state.page = target; renderGrid(); renderPagination(); scrollTopGrid();
          });
          return btn;
        }

        function getPageList(current, total) {
          var arr = [];
          if (total <= 7) { for (var i = 1; i <= total; i++) arr.push(i); return arr; }
          arr.push(1);
          if (current > 4) arr.push('…');
          var s = Math.max(2, current - 1); var e = Math.min(total - 1, current + 1);
          for (var j = s; j <= e; j++) arr.push(j);
          if (current < total - 3) arr.push('…');
          arr.push(total);
          return arr;
        }

        function scrollTopGrid() {
          var gridTop = elGrid.getBoundingClientRect().top + window.pageYOffset;
          var filterBottom = 0;
          var filterBar = document.querySelector('.filter-bar');
          if (filterBar) filterBottom = filterBar.offsetHeight;
          window.scrollTo({ top: Math.max(0, gridTop - filterBottom - 12), behavior: 'smooth' });
        }

        // ---------- Master render ----------
        function applyAndRender() {
          computeFiltered();
          var totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
          if (state.page > totalPages) state.page = totalPages;
          if (state.page < 1) state.page = 1;
          elTotal.textContent = allData.length;
          elFiltered.textContent = filtered.length;
          if (filtered.length === 0) {
            elGrid.innerHTML = ''; elEmpty.classList.add('show'); elPagination.innerHTML = ''; refreshIcons(); return;
          }
          elEmpty.classList.remove('show');
          renderGrid(); renderPagination(); refreshIcons();
        }

        // ---------- Lightbox ----------
        function openLightbox(idx) {
          lbIndex = idx;
          elLightbox.classList.add('open');
          elLightbox.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
          loadLightboxItem(); refreshIcons();
        }
        function closeLightbox() {
          elLightbox.classList.remove('open');
          elLightbox.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
          resetZoom(false);
        }
        function loadLightboxItem() {
          var item = filtered[lbIndex];
          if (!item) return;
          resetZoom(false);
          elLbImage.src = imgSrc(item); elLbImage.alt = item.a || '';
          elLbCounter.textContent = (lbIndex + 1) + ' / ' + filtered.length;
          elLbTags.innerHTML = '';
          elLbTags.appendChild(makeTag(formatDate(item.d), ''));
          elLbTags.appendChild(makeTag(item.cn || '', 'cat'));
          if (item.a) elLbTags.appendChild(makeTag(item.a, ''));
          if (item.ch) elLbTags.appendChild(makeTag(item.ch, ''));
          elLbPrompt.textContent = (item.p || '') + (item.w && item.h ? '\n\n尺寸：' + item.w + 'x' + item.h : '');
          elLbFilename.textContent = item.f || '';
          document.getElementById('lb-prev').disabled = lbIndex <= 0;
          document.getElementById('lb-next').disabled = lbIndex >= filtered.length - 1;
          if (copyTimer) { clearTimeout(copyTimer); copyTimer = null; }
          elLbCopy.classList.remove('copied'); elLbCopyText.textContent = '复制提示词';
        }
        function makeTag(text, extra) {
          var span = document.createElement('span');
          span.className = 'lb-tag' + (extra ? ' ' + extra : '');
          span.textContent = text;
          return span;
        }
        function navLightbox(dir) {
          var ni = lbIndex + dir;
          if (ni < 0 || ni >= filtered.length) return;
          lbIndex = ni; loadLightboxItem();
        }

        // ---------- Zoom & Pan ----------
        function applyTransform() {
          elLbImage.style.transform = 'translate(' + lbPanX + 'px, ' + lbPanY + 'px) scale(' + lbZoom + ')';
          elLbZoomPct.textContent = Math.round(lbZoom * 100) + '%';
          elLbStage.style.cursor = lbZoom > 1 ? (isDragging ? 'grabbing' : 'grab') : 'zoom-in';
        }
        function setZoom(z) {
          var nz = Math.round(z / 0.25) * 0.25;
          nz = Math.round(nz * 100) / 100;
          nz = Math.max(0.5, Math.min(5, nz));
          lbZoom = nz;
          if (lbZoom <= 1) { lbPanX = 0; lbPanY = 0; }
          applyTransform();
        }
        function resetZoom(apply) {
          lbZoom = 1; lbPanX = 0; lbPanY = 0;
          if (apply !== false) applyTransform();
          else { elLbImage.style.transform = ''; elLbZoomPct.textContent = '100%'; elLbStage.style.cursor = 'zoom-in'; }
        }

        document.getElementById('lb-zoom-in').addEventListener('click', function () { setZoom(lbZoom + 0.25); });
        document.getElementById('lb-zoom-out').addEventListener('click', function () { setZoom(lbZoom - 0.25); });
        document.getElementById('lb-zoom-reset').addEventListener('click', function () { resetZoom(true); });

        elLbStage.addEventListener('wheel', function (e) {
          if (!elLightbox.classList.contains('open')) return;
          e.preventDefault();
          setZoom(lbZoom + (e.deltaY < 0 ? 0.25 : -0.25));
        }, { passive: false });

        elLbStage.addEventListener('mousedown', function (e) {
          if (lbZoom <= 1) return;
          isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY;
          panStartX = lbPanX; panStartY = lbPanY;
          elLbStage.style.cursor = 'grabbing'; e.preventDefault();
        });
        window.addEventListener('mousemove', function (e) {
          if (!isDragging) return;
          lbPanX = panStartX + (e.clientX - dragStartX);
          lbPanY = panStartY + (e.clientY - dragStartY);
          applyTransform();
        });
        window.addEventListener('mouseup', function () {
          if (!isDragging) return;
          isDragging = false;
          elLbStage.style.cursor = lbZoom > 1 ? 'grab' : 'zoom-in';
        });

        var touchStartX = 0, touchStartY = 0, touchPanX = 0, touchPanY = 0, touchDragging = false;
        elLbStage.addEventListener('touchstart', function (e) {
          if (lbZoom <= 1 || e.touches.length !== 1) return;
          touchDragging = true;
          touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
          touchPanX = lbPanX; touchPanY = lbPanY;
        }, { passive: true });
        elLbStage.addEventListener('touchmove', function (e) {
          if (!touchDragging || e.touches.length !== 1) return;
          lbPanX = touchPanX + (e.touches[0].clientX - touchStartX);
          lbPanY = touchPanY + (e.touches[0].clientY - touchStartY);
          applyTransform();
        }, { passive: true });
        elLbStage.addEventListener('touchend', function () { touchDragging = false; });

        document.getElementById('lb-close').addEventListener('click', closeLightbox);
        document.getElementById('lb-prev').addEventListener('click', function () { navLightbox(-1); });
        document.getElementById('lb-next').addEventListener('click', function () { navLightbox(1); });

        elLbStage.addEventListener('click', function (e) {
          if (e.target === elLbStage && lbZoom <= 1) closeLightbox();
        });
        var stageArea = document.querySelector('.lb-stage-area');
        if (stageArea) {
          stageArea.addEventListener('click', function (e) {
            if (e.target === stageArea && lbZoom <= 1) closeLightbox();
          });
        }

        elLbCopy.addEventListener('click', function () {
          var text = elLbPrompt.textContent || '';
          if (!text) return;
          function showCopied() {
            elLbCopy.classList.add('copied'); elLbCopyText.textContent = '已复制';
            if (copyTimer) clearTimeout(copyTimer);
            copyTimer = setTimeout(function () { elLbCopy.classList.remove('copied'); elLbCopyText.textContent = '复制提示词'; }, 2000);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showCopied).catch(function () { fallbackCopy(text, showCopied); });
          } else { fallbackCopy(text, showCopied); }
        });

        function fallbackCopy(text, onOk) {
          try {
            var ta = document.createElement('textarea');
            ta.value = text; ta.setAttribute('readonly', '');
            ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            if (ok && onOk) onOk(); else alert('复制失败，请手动选择文本复制。');
          } catch (err) { alert('复制失败，请手动选择文本复制。'); }
        }

        document.addEventListener('keydown', function (e) {
          if (!elLightbox.classList.contains('open')) return;
          switch (e.key) {
            case 'Escape': e.preventDefault(); closeLightbox(); break;
            case 'ArrowLeft': e.preventDefault(); navLightbox(-1); break;
            case 'ArrowRight': e.preventDefault(); navLightbox(1); break;
            case '+': case '=': e.preventDefault(); setZoom(lbZoom + 0.25); break;
            case '-': case '_': e.preventDefault(); setZoom(lbZoom - 0.25); break;
            case '0': e.preventDefault(); resetZoom(true); break;
          }
        });

        // ---------- Init ----------
        renderDateTabs();
        renderSubchips();
        applyAndRender();
        refreshIcons();
      })();
    </script>
</body>
</html>
